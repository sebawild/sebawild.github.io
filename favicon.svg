<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Sebastian Wild">
  <title>Sebastian Wild</title>
  <!-- The small cut of the two-pivots mark.
       Browsers paint the SVG favicon straight onto the tab strip, which is
       dark in dark mode -- #46433A bars would all but vanish there, so the
       ink and the pivots both lift under prefers-color-scheme: dark. -->
  <style>
    .ink   { fill: #46433A; }
    .pivot { fill: #902015; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #E4E0CF; }
      .pivot { fill: #E0705F; }
    }
  </style>
  <g class="ink">
    <rect x="6" y="64" width="13" height="28"/>
    <rect x="44" y="44" width="13" height="48"/>
    <rect x="81" y="20" width="13" height="72"/>
  </g>
  <g class="pivot">
    <rect x="28" y="8" width="7" height="84"/>
    <rect x="65" y="8" width="7" height="84"/>
  </g>
</svg>
