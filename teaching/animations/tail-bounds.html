<style>
  /* Same token values as /css/animations.css, repeated so the page also works when opened directly. */

  .wi-topbar { display:flex; align-items:baseline; justify-content:space-between; gap:1em; flex-wrap:wrap;

  /* --- transport: slider + phase bar ---

       border:1px solid var(--wi-border-soft); border-radius:3px; }
  .progress input[type=range]::-moz-range-track { height:6px; background:var(--wi-panel);
       border:1px solid var(--wi-border-soft); border-radius:3px; }
  .progress input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:16px; height:16px;
       border-radius:50%; background:var(--wi-accent); border:2px solid var(--wi-panel-2); margin-top:-6px;
       box-shadow:0 0 0 1px var(--wi-accent); box-sizing:border-box; }
  .progress input[type=range]::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:var(--wi-accent);
       border:2px solid var(--wi-panel-2); box-shadow:0 0 0 1px var(--wi-accent); box-sizing:border-box; }

            white-space:nowrap; text-align:right; padding-top:1px; }
  #aStepNo { display:inline-block; width:7em; }
  .phasebar { display:flex; margin:5px 8px 0; width:calc(100% - 16px); }
  .phasebtn { position:relative; overflow:hidden; flex:none; padding:3px 0; font-size:.68rem; line-height:1.3;
              font-family:var(--wi-font-head); letter-spacing:.03em; text-align:center;
              background:var(--wi-panel); border:1px solid var(--wi-border-soft);
              border-left-width:0; border-radius:0; color:var(--wi-ink-faint); cursor:pointer; white-space:nowrap; }
  .phasebtn:first-child { border-left-width:1px; border-radius:var(--wi-radius) 0 0 var(--wi-radius); }
  .phasebtn:last-child { border-radius:0 var(--wi-radius) var(--wi-radius) 0; }
  .phasebtn:hover:not(:disabled) { background:var(--wi-panel-2); border-color:var(--wi-border-soft); }
  .phasebtn .fill { position:absolute; left:0; top:0; bottom:0; background:#eedcd3;

  .phasebtn .fill.empty { border-right:0; }
  .phasebtn .lab { position:relative; }
  .phasebtn.on, .phasebtn.on:hover:not(:disabled) { border-color:var(--wi-accent-soft); color:var(--wi-accent); font-weight:bold; }

  .legend { display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:4px; font-size:.78rem; color:var(--wi-ink-soft); align-items:center; min-height:2.2em; }
  .legend .item { display:inline-flex; align-items:center; gap:6px; }
  .legend .sw { display:inline-block; width:14px; height:12px; border:1px solid var(--wi-ink-soft); border-radius:2px; }
  .status { background:var(--wi-controls); border:1px solid var(--wi-border-soft); border-radius:var(--wi-radius);
            padding:9px 13px; font-size:.88rem; color:var(--wi-ink-strong); height:12.8em; overflow-y:auto; line-height:1.55; }
  .status b { font-family:var(--wi-font-head); font-weight:normal; letter-spacing:.04em; color:var(--wi-accent); }
  .status p { margin:0 0 6px; }
  .readout { font-size:.88rem; line-height:1.6; min-height:7.4em; }
  .readout .row { white-space:nowrap; overflow-x:auto; overflow-y:hidden; padding:1px 0; }
  .readout .muted { color:var(--wi-ink-faint); }

  details.explain { background:var(--wi-panel); border:1px solid var(--wi-border-soft); border-radius:var(--wi-radius-lg); }

  /* the table of bounds */
  table.bt { border-collapse:collapse; width:100%; font-size:.86rem; }

  table.bt tr:hover { background:#f3ebdd; }
  .lsw { display:inline-block; vertical-align:middle; }
  .tnote { font-size:.76rem; color:var(--wi-ink-soft); margin-top:6px; line-height:1.5; }

  /* input editor */
  details.editor { margin-top:16px; background:var(--wi-panel); border:1px solid var(--wi-border-soft); border-radius:var(--wi-radius-lg); }
  details.editor > summary { cursor:pointer; padding:11px 16px; font-family:var(--wi-font-head); font-size:.78rem; letter-spacing:.06em; color:var(--wi-ink-soft); }

  textarea { width:100%; height:170px; font-family:var(--wi-font-mono); font-size:.76rem; background:var(--wi-panel-2);

<div class="wi-topbar hide-p">
  <a class="wi-home" href="https://www.wild-inter.net/">wild-inter.net</a>
</div>

<div class="titlebar">
  <h1>Tail bounds</h1>
  <span class="ctl" style="gap:14px">
    <span class="seg" id="modeSeg" role="tablist">
      <button data-mode="markov" class="on" role="tab" title="Expectation as the area under the tail function; Markov's inequality as a rectangle under it">Markov</button>
      <button data-mode="cheb" role="tab" title="The same picture for (X − E[X])²">Chebychev</button>
      <button data-mode="chern" role="tab" title="The same picture for e^{t(X − a)}, and the choice of t">Chernoff</button>
      <button data-mode="race" role="tab" title="Markov, Chebychev, Chernoff and Hoeffding against the exact tail of a binomial distribution">Bounds compared</button>
      <button data-mode="small" role="tab" title="The same comparison for p = 1/n: one bin when n balls go into n bins">Small p</button>
    </span>
  </span>
  <span class="ctl hide-p"><button id="presBtn" title="A clutter-free view for the lecture (Esc to leave)">Presentation view</button></span>
</div>
<button id="exitPres" class="only-p exitp" title="Leave the presentation view (Esc)">✕ leave presentation</button>

<!-- ======================================================================
     Tabs 1–3: Markov, Chebychev, Chernoff as areas (one drawing area, three states)
     ====================================================================== -->
<div id="tabArea">
  <p class="subtitle hide-p" id="aSub"></p>
  <div class="controls hide-p">
    <div class="ctl"><label for="aDist">Distribution</label><select id="aDist"></select></div>
    <div class="ctl" id="aParams"></div>
    <span class="ctl hidden" id="aChernCtl" style="gap:10px 18px">
      <span class="ctl"><span class="pl" title="the threshold: the event is X ≥ a (or drag the red marker on the left)">a</span><input type="text" class="num" id="aA" title="the threshold: the event is X ≥ a"></span>
      <span class="ctl"><input type="range" class="plain" id="aT" min="0" max="1000" style="width:140px" title="the parameter t of e^{t(X−a)}"><span class="stepno" id="aTVal" style="width:4.6em;text-align:left">t =</span>
        <button id="aTStar" title="the t with the smallest bound">\(t^*\)</button><button id="aTRel" title="the t of the usual proof, for which the estimate E[e^{tX}] ≤ e^{μ(e^t−1)} is smallest">\(\ln(1+\delta)\)</button>
        <button id="aSweep" title="move t from 0 to its largest value and back to t*">sweep t</button></span>
      <label class="chk hidden" title="also draw the weights of Markov and Chebychev"><input type="checkbox" id="aCmp"> compare weights</label>
      <label class="chk" title="show only the lower part of the staircase, where its area is; the thin blocks above are summarized"><input type="checkbox" id="aZoom" checked> zoom in</label>
    </span>
  </div>
  <div class="transport">
    <div class="transport-row">
      <span class="ctl" style="gap:6px">
        <button id="aReset" class="icon" title="Back to the first step  (Home)" aria-label="Back to the first step">&#x21BA;</button>
        <button id="aBack" class="icon" title="One step back  (←)" aria-label="One step back">&#x23EE;&#xFE0E;</button>
        <button id="aStep" class="icon pri" title="One step forward  (→)" aria-label="One step forward">&#x23ED;&#xFE0E;</button>
        <button id="aPlay" class="icon" title="Play / pause  (space)" aria-label="Play">&#x25B6;&#xFE0E;</button>
      </span>
      <span class="progress">
        <input type="range" id="aScrub" min="0" max="100000" step="1" value="0" aria-label="Step">
        <div class="phasebar" id="aPhaseBar"></div>
      </span>
      <span class="stepno" id="aStepNo">— / —</span>
      <span class="ctl" style="gap:6px">
        <span class="lbl">Delay</span>
        <input type="range" class="plain" id="aDelay" min="150" max="2000" value="900" style="width:88px">
        <span class="stepno" id="aDelayVal" style="width:3.6em">900ms</span>
      </span>
    </div>
  </div>
  <div class="stage" id="stageA">
    <div class="col-main">

    let up = 0; for (let i = 0; i < landed; i++) { const Ly = M.layers[i]; if (Ly.y1 > ymaxR) up += Math.min(Ly.v, xEdge) * (Ly.y1 - Math.max(Ly.y0, ymaxR)); }
    s += `<line x1="${f1(X(0) - 6)}" x2="${f1(X(0) + 6)}" y1="${T - 12}" y2="${T - 4}" stroke="${soft}" stroke-width="1.4"/><line x1="${f1(X(0) - 6)}" x2="${f1(X(0) + 6)}" y1="${T - 7}" y2="${T + 1}" stroke="${soft}" stroke-width="1.4"/>`;

    s += mathAt(K === "cheb" ? "b\\cdot\\Prob{Y\\ge b}\\;\\le\\;\\E{Y}=\\Var{X}" : "1\\cdot\\Prob{X\\ge a}\\;\\le\\;\\E{e^{t(X-a)}}", R1, T - 10, 15, "end", red).svg;

    s += mathAt("\\text{so far: }" + (K === "chern" ? fP(sofar, 4) : fnum(sofar)) + "\\text{ of }" + EVs, R1, T - 32, 14, "end", soft).svg;

/* ---------- Chernoff: the bound against t ---------- */
let tGeom = null;
function renderTPlot() {
  const M = A.M, C = M.C; if (!C) return;
  const svg = el("aTSvg"), W = Math.max(260, el("aTWrap").clientWidth), H = 210;
  svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const x0 = 52, x1 = W - 16, y0 = 12, y1 = H - 36, tMax = C.tMax;
  const ts = [], lbs = [], rels = [];
  for (let i = 0; i <= 200; i++) { const t = tMax * i / 200; ts.push(t); lbs.push(C.lb(t)); if (C.rel) rels.push(C.rel(t)); }
  let lo = Math.min(...lbs, ...(C.rel ? rels : []), isFinite(C.truthLn) ? C.truthLn : 0) / Math.LN10;
  lo = Math.max(-60, Math.min(-1, Math.floor(lo - 0.3)));
  const X = t => x0 + t / tMax * (x1 - x0);
  const Yl = l => y0 + (Math.max(lo, Math.min(0, l / Math.LN10)) / lo) * (y1 - y0);
  tGeom = { x0, x1, X, tMax };
  const soft = "var(--wi-ink-soft)";
  let s = "";
  const dst = -lo <= 8 ? 1 : -lo <= 20 ? 2 : -lo <= 40 ? 5 : 10;
  for (let e = 0; e >= lo; e -= dst) {
    const y = Yl(e * Math.LN10);
    s += `<line x1="${x0}" x2="${x1}" y1="${f1(y)}" y2="${f1(y)}" stroke="var(--wi-border-soft)" stroke-width="${e === 0 ? 1 : 0.7}"/>`;
    s += e === 0 ? `<text class="sv-tick" x="${x0 - 7}" y="${f1(y + 4)}" text-anchor="end">1</text>`
                 : `<text class="sv-tick" x="${x0 - 7}" y="${f1(y + 4)}" text-anchor="end">10<tspan dy="-6" font-size="9.5">−${-e}</tspan></text>`;
  }
  const xs = niceStep(tMax, 4);
  for (let t = 0; t <= tMax + 1e-9; t += xs) s += `<line x1="${f1(X(t))}" x2="${f1(X(t))}" y1="${y1}" y2="${y1 + 4}" stroke="${soft}"/><text class="sv-tick" x="${f1(X(t))}" y="${y1 + 17}" text-anchor="middle">${fnum(t, 2)}</text>`;
  s += `<line x1="${x0}" x2="${x1}" y1="${y1}" y2="${y1}" stroke="${soft}"/><line x1="${x0}" x2="${x0}" y1="${y0}" y2="${y1}" stroke="${soft}"/>`;
  s += mathAt("t", x1, y1 + 32, 14, "end", soft).svg;
  const path = (arr, attrs) => { let d = ""; arr.forEach((l, i) => { if (isFinite(l)) d += (d ? "L" : "M") + f1(X(ts[i])) + "," + f1(Yl(l)); }); return `<path d="${d}" fill="none" ${attrs}/>`; };
  if (isFinite(C.truthLn)) {
    const y = Yl(C.truthLn);
    s += `<line x1="${x0}" x2="${x1}" y1="${f1(y)}" y2="${f1(y)}" stroke="var(--c-exact)" stroke-width="2"/>`;
    s += mathAt("\\Prob{X\\ge a}", x1 - 2, y + 16, 13, "end", "var(--c-exact)").svg;
  }
  if (C.rel) s += path(rels, `stroke="var(--c-cher)" stroke-width="1.6" stroke-dasharray="6 3"`);
  s += path(lbs, `stroke="var(--c-cher)" stroke-width="2.4"`);
  if (C.rel && C.tRel !== null && C.tRel <= tMax) {
    const y = Yl(C.rel(C.tRel));
    s += `<circle cx="${f1(X(C.tRel))}" cy="${f1(y)}" r="4" fill="var(--wi-panel)" stroke="var(--c-cher)" stroke-width="1.6"/>`;
    s += mathAt("\\ln(1+\\delta)", X(C.tRel), y + 20, 12.5, "middle", "var(--c-cher)").svg;
  }
  if (C.tStar > 0 && C.tStar <= tMax) {
    const y = Yl(C.lb(C.tStar));
    s += `<circle cx="${f1(X(C.tStar))}" cy="${f1(y)}" r="4.5" fill="var(--c-cher)"/>`;
    s += mathAt("t^*", X(C.tStar) + 8, y - 8, 13.5, "start", "var(--c-cher)").svg;
  }
  const xt = X(A.t);
  s += `<line x1="${f1(xt)}" x2="${f1(xt)}" y1="${y0}" y2="${y1}" stroke="var(--c-rect)" stroke-width="1.6"/>`;
  s += `<circle cx="${f1(xt)}" cy="${f1(Yl(C.lb(A.t)))}" r="4" fill="var(--c-rect)" stroke="var(--wi-bg)" stroke-width="1.5"/>`;
  s += `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0 + 20}" fill="transparent" style="cursor:ew-resize"/>`;
  svg.innerHTML = s;
}

/* ---------- the readable side: status, sums, rectangle ---------- */

  if (key === aSideKey && el("aStatus")._shown) return;

         <p>The lines show where each value \\(n\\) goes: to \\(y=(n-\\E{X})^2\\). Step forward to send the bars along them.</p>`
      : `<p>The distribution of \\(X\\): one bar per value \\(n\\), of height \\(\\Prob{X=n}\\).</p>
         <p>In \\(\\E{X}=\\sum_n n\\cdot\\Prob{X=n}=${EX}\\) the bar of \\(n\\) counts \\(n\\) times. Step forward: \\(n\\) copies of each bar are laid out side by side, largest \\(n\\) at the bottom.</p>`;
  } else if (off && step === 1) {
    st = `<p>Every bar of \\(X\\) moved to its value \\(y=(n-\\E{X})^2\\), keeping its probability: below the staircase is now the distribution of \\(Y\\). The map folds at \\(\\E{X}\\): values at the same distance on both sides land at (almost) the same \\(y\\), values near \\(\\E{X}\\) land near 0.</p>
          <p>From here on it is Markov's picture for \\(Y\\): the bar at \\(y\\) becomes a block of width \\(y\\), widest at the bottom.</p>`;
  } else if (bi <= L) {
    const Ly = M.layers[bi - 1];
    st = M.cheb
      ? `<p>Value \\(n=${Ly.n}\\): width \\((${Ly.n}-${EX})^2=${fnum(Ly.v)}\\), height \\(\\Prob{X=${Ly.n}}=${fP(Ly.p)}\\), area \\(${fnum(Ly.v * Ly.p)}\\).</p>
         <p>The blocks are stacked by width, widest at the bottom, so the stack never gets wider going up.</p>`
      : `<p>The bar of \\(n=${Ly.n}\\) contributes \\(${Ly.n}\\cdot\\Prob{X=${Ly.n}}=${Ly.n}\\cdot${fP(Ly.p)}=${fnum(Ly.v * Ly.p)}\\): its ${Ly.n} ${Ly.n === 1 ? "copy goes" : "copies go"} to the columns \\(1${Ly.n > 1 ? (Ly.n > 2 ? ",\\dots," : ",") + Ly.n : ""}\\).</p>
         <p>Copy \\(j\\) of every bar \\(n\\ge j\\) lands in column \\(j\\).${M.pmf[0] > 0 && step === 1 ? " The value \\(0\\) has no copies: it adds nothing to \\(\\E{X}\\)." : ""}</p>`;

         <p style="text-align:center">\\(\\displaystyle\\E{X}=\\sum_{n\\ge1}\\Prob{X\\ge n}\\).</p>

  } else if (!M.cheb) {

    st = `<p>The rectangle \\([0,a]\\times[0,\\Prob{X\\ge a}]\\) fits under the staircase: every column \\(j\\le a\\) is at least \\(\\Prob{X\\ge a}\\) high, because the staircase never goes up. Hence</p>
          <p style="text-align:center">\\(\\displaystyle a\\cdot\\Prob{X\\ge a}\\le\\E{X}\\), i.e.&ensp;\\(\\displaystyle\\Prob{X\\ge a}\\le\\frac{\\E{X}}{a}\\).</p>
          <p>${tight ? "Here the rectangle <i>is</i> the whole area: Markov's inequality is tight. That happens exactly when all mass sits on \\(\\{0,a\\}\\)." :
            "What the rectangle misses: the area above it (columns before \\(a\\) that are higher) and the columns after \\(a\\). Drag the red edge."}</p>`;
  } else {
    const b = A.bC, a = Math.sqrt(b);
    st = `<p>The same rectangle for \\(Y\\): width \\(b\\), height \\(\\Prob{Y\\ge b}\\), so \\(\\Prob{Y\\ge b}\\le\\E{Y}/b\\). With \\(b=a^2\\):</p>
          <p style="text-align:center">\\(\\displaystyle\\Prob{|X-\\E{X}|\\ge a}=\\Prob{Y\\ge a^2}\\le\\frac{\\Var{X}}{a^2}\\).</p>

    for (const j of [...Array(Math.min(lim, Math.round(M.vmax))).keys()].map(j => j + 1)) colsT.push(fP(M.tail(j)));
  } else {
    for (const Ly of shownLayers.slice(0, lim)) rowsT.push(`${fnum(Ly.v, 2)}\\cdot${fP(Ly.p)}`);
    let prev = 0; for (const st2 of M.steps.slice(0, lim)) { colsT.push(`${fnum(st2.v - prev, 2)}\\cdot${fP(st2.h)}`); prev = st2.v; }
  }

  const rowsSum = shownLayers.reduce((x, Ly) => x + Ly.v * Ly.p, 0);
  let sm = `<div class="rule">by rows: one row per value \\(n\\)</div>`;
  if (landed === 0) sm += `<div class="row muted">${M.cheb ? "\\(\\sum_n (n-\\E{X})^2\\cdot\\Prob{X=n}\\)" : "\\(\\sum_n n\\cdot\\Prob{X=n}\\)"} — step forward</div>`;
  else sm += `<div class="row">\\(${more(rowsT, landed)}\\) ${landed < L ? "<span class='muted'>(so far: " + fnum(rowsSum) + ")</span>" : "\\(=" + fnum(M.EV) + "\\)"}</div>`;
  sm += `<div class="rule">by columns: ${M.cheb ? "one strip per step of the staircase" : "one column per \\(j\\ge1\\)"}</div>`;
  if (step < aStairs()) sm += `<div class="row muted">${M.cheb ? "\\(\\int_0^\\infty\\Prob{Y\\ge y}\\,dy\\)" : "\\(\\sum_{j\\ge1}\\Prob{X\\ge j}\\)"} — once the staircase is complete</div>`;
  else sm += `<div class="row">\\(${more(colsT, M.cheb ? M.steps.length : Math.round(M.vmax))}=${fnum(M.EV)}\\)</div>`;
  setMath(el("aSums"), sm);

  /* rectangle */
  el("aRectTitle").textContent = M.cheb ? "Chebychev's inequality" : "Markov's inequality";
  let rc;
  if (step < aRect() || !M.L) {
    rc = `<div class="row muted">${M.cheb ? "\\(\\Prob{|X-\\E{X}|\\ge a}\\le\\Var{X}/a^2\\)" : "\\(\\Prob{X\\ge a}\\le\\E{X}/a\\)"} — in the last step</div>`;
  } else if (!M.cheb) {
    const a = A.aM, h = M.tail(a);
    rc = `<div class="row">\\(a=${a}\\):&emsp;\\(\\Prob{X\\ge ${a}}=${fP(h, 4)}\\)</div>
          <div class="row red">\\(a\\cdot\\Prob{X\\ge a}=${fnum(a * h, 4)}\\;\\le\\;\\E{X}=${fnum(M.EV, 4)}\\)</div>
          <div class="row">\\(\\Prob{X\\ge ${a}}=${fP(h, 4)}\\;\\le\\;\\E{X}/a=${fnum(M.EV / a, 4)}\\)</div>`;
  } else {
    const b = A.bC, a = Math.sqrt(b), h = M.tail(b);
    rc = `<div class="row">\\(Y=(X-\\E{X})^2\\), \\(b=a^2=${fnum(b, 4)}\\), \\(a=${fnum(a, 4)}\\)</div>
          <div class="row">\\(\\Prob{|X-${fnum(M.mu)}|\\ge ${fnum(a, 3)}}=\\Prob{Y\\ge b}=${fP(h, 4)}\\)</div>
          <div class="row red">\\(b\\cdot\\Prob{Y\\ge b}=${fnum(b * h, 4)}\\;\\le\\;\\Var{X}=${fnum(M.EV, 4)}\\)</div>
          <div class="row">\\(\\Prob{Y\\ge b}=${fP(h, 4)}\\;\\le\\;\\Var{X}/a^2=${fnum(M.EV / b, 4)}\\)</div>`;

  el("aMeta").textContent = A_PRESETS[A.key].label + (A.key === "geom" ? " (cut off, renormalized)" : "");
}
/* Chernoff's side: numbers change with every move of t, so plain HTML with cached formula snippets */
function aSideChern() {
  const M = A.M, C = M.C, step = A.step, L = M.L, a = A.aC, t = A.t, landed = clamp(step - 1, 0, L);
  const truth = C.truth, bnd = M.EV;
  let st = "";
  if (step === 0) {
    st = `<p>The threshold \\(a=${a}\\), and the event \\(X\\ge a\\): its probability is ${fh(truth)}. Chernoff applies Markov to \\(Y=e^{t(X-a)}\\) for a \\(t>0\\). Then \\(X\\ge a\\) exactly when \\(Y\\ge1\\), so \\(\\Prob{X\\ge a}=\\Prob{Y\\ge 1}\\le\\E{Y}\\).</p>
          <p>The lines show where each value \\(n\\) goes: to \\(y=e^{t(n-a)}\\). Step forward to send the bars along them.</p>`;
  } else if (step === 1) {
    st = `<p>Every bar moved to \\(y=e^{t(n-a)}\\), keeping its probability. Values below \\(a\\) land in \\((0,1)\\), squeezed towards 0 the more, the larger \\(t\\); \\(a\\) itself lands at exactly 1; values above \\(a\\) land beyond 1, spread out exponentially. The event \\(X\\ge a\\) is now \\(Y\\ge1\\) (shaded). Move \\(t\\) to see the map change.</p>
          <p>From here on it is Markov's picture for \\(Y\\).</p>`;
  } else if (step - 1 <= L) {
    const Ly = M.layers[step - 2], n = Ly.n;
    st = `<p>Value \\(n=${n}\\): a block of width \\(e^{t(${n}-a)}\\) = ${fh(Ly.v)} and height \\(\\Prob{X=${n}}\\) = ${fh(Ly.p)}.</p><p>` +
         (n < a ? "Below the threshold: narrower than 1, and the larger \\(t\\), the narrower."
          : n === a ? "At the threshold: width exactly 1, whatever \\(t\\) is."
          : "Above the threshold: wider than 1, and the larger \\(t\\), the wider.") + " Widest blocks at the bottom.</p>";
  } else if (step === aStairs()) {
    st = `<p>The area is \\(\\E{Y}=\\sum_n e^{t(n-a)}\\,\\Prob{X=n}\\) = ${fh(bnd)}.</p>
          <p>Blocks of values far above \\(a\\) can be much wider than the picture: they run beyond the right edge, and the number there says how much area is out of view.</p>`;
  } else {
    let reg;
    if (C.tStar === 0) reg = "Here \\(a\\le\\E{X}\\): no \\(t>0\\) helps, the bound stays above 1.";
    else if (t < 0.85 * C.tStar) reg = "For \\(t\\) below \\(t^*\\), the values below \\(a\\) still have wide blocks: most of the waste is <i>above</i> the rectangle. Increase \\(t\\).";
    else if (t > 1.15 * C.tStar) reg = "For \\(t\\) above \\(t^*\\), the few values above \\(a\\) get very wide blocks: most of the waste is to the <i>right</i> of the rectangle. Decrease \\(t\\).";
    else reg = "At \\(t\\approx t^*\\) the waste above the rectangle and the waste to its right are balanced: this is the best bound of this form.";
    st = `<p>The rectangle of width 1 and height \\(\\Prob{Y\\ge 1}=\\Prob{X\\ge a}\\) fits under the staircase. So for every \\(t>0\\)</p>
          <p style="text-align:center">\\(\\displaystyle\\Prob{X\\ge a}\\le\\E{e^{t(X-a)}}=e^{-ta}\\,\\E{e^{tX}}\\).</p><p>${reg}</p>`;
  }
  setHTML(el("aStatus"), mhx(st));

  /* sums: rows and columns */
  const lim = 5;
  let sm = `<div class="rule">by rows: one row per value \\(n\\)</div>`;
  if (landed === 0) sm += `<div class="row muted">\\(\\sum_n e^{t(n-a)}\\cdot\\Prob{X=n}\\) — step forward</div>`;
  else {
    const sh = M.layers.slice(0, landed), sofar = sh.reduce((x, Ly) => x + Ly.v * Ly.p, 0);
    sm += `<div class="row">${sh.slice(0, lim).map(Ly => fh(Ly.v) + "·" + fh(Ly.p)).join(" + ")}${landed > lim ? " + …" : ""} ${landed < L ? "<span class='muted'>(so far: " + fh(sofar) + ")</span>" : "= " + fh(bnd)}</div>`;
  }
  sm += `<div class="rule">by columns: one strip per step of the staircase</div>`;
  if (step < aStairs()) sm += `<div class="row muted">\\(\\int_0^\\infty\\Prob{Y\\ge y}\\,dy\\) — once the area is complete</div>`;
  else { let prev = 0; const cs = M.steps.slice(0, lim).map(s2 => { const r = fh(s2.v - prev) + "·" + fh(s2.h); prev = s2.v; return r; });
         sm += `<div class="row">${cs.join(" + ")}${M.steps.length > lim ? " + …" : ""} = ${fh(bnd)}</div>`; }
  setHTML(el("aSums"), mhx(sm));

  /* the bound */

/* ---------- pointer: Markov/Chebychev drag the threshold on the right, Chernoff drags a on the left ---------- */
function initAPointer() {
  const svg = el("aSvg");
  let drag = null;
  const setFrom = e => {
    if (!aGeom || !A.M.L) return;
    const r = svg.getBoundingClientRect(), x = e.clientX - r.left, M = A.M;
    if (drag === "a") {
      const a = clamp(Math.round((x - aGeom.L0) / aGeom.uL), 1, Math.max(1, aGeom.N));
      if (a !== A.aC) { A.aC = a; aBuildModel(); aSyncChern(); renderA(); writeHash(); }
      return;
    }
    const t = (x - aGeom.R0) / aGeom.uR;
    if (M.kind === "markov") A.aM = clamp(Math.round(t), 1, Math.max(1, Math.round(M.vmax)));
    else { let best = M.vs[0]; for (const v of M.vs) if (Math.abs(v - t) < Math.abs(best - t)) best = v; A.bC = best; }
    if (A.step !== aRect()) { aStopPlay(); A.step = aRect(); A.tw = null; aSyncTransport(); }
    renderA(); writeHash();
  };
  svg.addEventListener("pointerdown", e => {
    if (!aGeom) return;
    const r = svg.getBoundingClientRect(), x = e.clientX - r.left;
    if (A.kind === "chern") { if (x > aGeom.Lw + 30) return; drag = "a"; aStopSweep(); }
    else { if (x < aGeom.R0 - 14) return; drag = "thr"; }
    svg.setPointerCapture(e.pointerId); e.preventDefault(); setFrom(e);
  });
  svg.addEventListener("pointermove", e => {
    if (drag) { setFrom(e); return; }
    if (!aGeom) return;
    const r = svg.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    const inBox = b => x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1;
    const hit = aGeom.bars.find(inBox) || [...aGeom.blocks].reverse().find(inBox);
    const n = hit ? hit.n : null;
    if (n !== A.hover) { A.hover = n; renderA(); }
    if (n === null) { tipHide(); return; }
    const M = A.M, p = M.pmf[n], K = M.kind;
    const v = K === "markov" ? n : K === "cheb" ? (n - M.mu) * (n - M.mu) : Math.exp(A.t * (n - A.aC));
    let h = `<div class="tt-h">${mh("n=" + n)}</div><table>`;
    h += `<tr><td>${mh("\\Prob{X=" + n + "}")}</td><td class="v">${fh(p)}</td></tr>`;
    if (K === "markov") h += `<tr><td>copies</td><td class="v">${n}</td></tr>`;
    else h += `<tr><td>${K === "cheb" ? mh("Y=(" + n + "-\\E{X})^2") : mh("Y=e^{t(" + n + "-a)}")}</td><td class="v">${fh(v)}</td></tr>`;
    h += `<tr><td>area ${K === "markov" ? mh("n\\cdot\\Prob{X=n}") : mh("Y\\cdot\\Prob{X=n}")}</td><td class="v">${fh(v * p)}</td></tr></table>`;
    tipShow(e, h);
  });
  svg.addEventListener("pointerleave", () => { if (A.hover !== null) { A.hover = null; renderA(); } tipHide(); });
  svg.addEventListener("pointerup", () => { drag = null; });
  svg.addEventListener("pointercancel", () => { drag = null; });
  /* the t plot */
  const ts = el("aTSvg");
  let td = false;
  const setT = e => { if (!tGeom) return; const r = ts.getBoundingClientRect(); aSetT((e.clientX - r.left - tGeom.x0) / (tGeom.x1 - tGeom.x0) * tGeom.tMax); };
  ts.addEventListener("pointerdown", e => { aStopSweep(); td = true; ts.setPointerCapture(e.pointerId); e.preventDefault(); setT(e); });
  ts.addEventListener("pointermove", e => { if (td) setT(e); });
  ts.addEventListener("pointerup", () => { td = false; writeHash(); });
  ts.addEventListener("pointercancel", () => { td = false; });
}

/* ---------- Chernoff: t ---------- */
function aSetT(t, quiet) {
  const C = A.M.C; if (!C) return;
  A.t = clamp(t, T_MIN, C.tMax);

  if (!quiet) writeHash();
}
let SWEEP = null;
function aStopSweep() { if (SWEEP) { cancelAnimationFrame(SWEEP.raf); SWEEP = null; el("aSweep").textContent = "sweep t"; writeHash(); } }
function aSweep() {
  if (SWEEP) { aStopSweep(); return; }
  const C = A.M.C, t0 = performance.now(), dur = 4500, tEnd = C.tStar > T_MIN ? C.tStar : C.tMax / 2;
  el("aSweep").textContent = "stop";
  const frame = now => {
    const u = clamp((now - t0) / dur, 0, 1);
    const t = u < 0.65 ? lerp(T_MIN, C.tMax, ease(u / 0.65)) : lerp(C.tMax, tEnd, ease((u - 0.65) / 0.35));
    aSetT(t, true);

}

const A_SUB = {
  markov: `For \\(X\\in\\N_0\\), every value \\(n\\) counts \\(n\\) times in \\(\\E{X}=\\sum_n n\\cdot\\Prob{X=n}\\).
    Lay out \\(n\\) copies of the bar of \\(n\\) and stack them: read by rows, the area is \\(\\E{X}\\); read by columns,
    column \\(j\\) holds one copy of every bar \\(n\\ge j\\), so it is \\(\\Prob{X\\ge j}\\) high.
    Markov's inequality is then a rectangle that fits under this staircase.`,
  cheb: `Chebychev's inequality is Markov's inequality for \\(Y=(X-\\E{X})^2\\). First every bar of \\(X\\) is sent to its value of \\(Y\\),
    which gives the distribution of \\(Y\\); then Markov's picture for \\(Y\\): the bar at \\(y\\) becomes a block of width \\(y\\), the blocks form the staircase
    \\(y\\mapsto\\Prob{Y\\ge y}\\) with area \\(\\E{Y}=\\Var{X}\\), and a rectangle under it bounds the probability of a deviation of at least \\(a\\) from the mean.`,
  chern: `The Chernoff bound is Markov's inequality for \\(Y=e^{t(X-a)}\\): value \\(n\\) is sent to \\(y=e^{t(n-a)}\\) and becomes a block of that width,
    so the threshold \\(a\\) has width exactly 1. The area is the bound \\(\\E{e^{t(X-a)}}\\), the rectangle of width 1 is \\(\\Prob{X\\ge a}\\).
    The parameter \\(t\\) trades the waste left of the threshold against the waste right of it.`
};
const A_EXPLAIN = {
  markov: `
<h4>Expectation as an area</h4>
<p>For \\(X\\in\\N_0\\), write \\(n=\\sum_{j=1}^{n}1\\): then \\(\\E{X}=\\sum_n n\\,\\Prob{X=n}=\\sum_n\\sum_{j\\le n}\\Prob{X=n}=\\sum_{j\\ge1}\\sum_{n\\ge j}\\Prob{X=n}=\\sum_{j\\ge1}\\Prob{X\\ge j}\\).
The picture is this exchange of summation order: rows are the values \\(n\\), columns the indices \\(j\\).</p>
<p>The same holds for any \\(X\\ge0\\): \\(\\E{X}=\\int_0^\\infty\\Prob{X\\ge t}\\,dt\\). The Chebychev and Chernoff pictures use exactly this, for variables with non-integer values.</p>
<h4>Markov from the picture</h4>
<p>The tail function \\(t\\mapsto\\Prob{X\\ge t}\\) never increases. So on \\([0,a]\\) it is at least \\(\\Prob{X\\ge a}\\), and the rectangle \\(a\\cdot\\Prob{X\\ge a}\\) fits under it. Equality needs both missing pieces to be empty: no mass strictly between \\(0\\) and \\(a\\), none above \\(a\\) (preset <i>two-point</i>).</p>`,
  cheb: `
<h4>Chebychev is Markov for \\((X-\\E{X})^2\\)</h4>
<p>\\(Y=(X-\\E{X})^2\\ge0\\) and \\(\\E{Y}=\\Var{X}\\). Markov for \\(Y\\) at \\(b=a^2\\) gives \\(\\Prob{|X-\\E{X}|\\ge a}\\le\\Var{X}/a^2\\).</p>
<p>The picture is the one for Markov, for a variable with non-integer values: \\(\\E{Y}=\\int_0^\\infty\\Prob{Y\\ge t}\\,dt\\), the area under the staircase.</p>
<h4>What squaring does</h4>
<p>A value at distance \\(2a\\) from the mean gets a block four times as wide as one at distance \\(a\\); values close to the mean get very narrow blocks. Both sides count: the event is \\(|X-\\E{X}|\\ge a\\), not only \\(X\\ge\\E{X}+a\\).</p>`,
  chern: `
<h4>Chernoff is Markov for \\(e^{tX}\\)</h4>
<p>For \\(t>0\\), \\(X\\ge a\\iff e^{tX}\\ge e^{ta}\\), so Markov gives \\(\\Prob{X\\ge a}\\le\\E{e^{tX}}/e^{ta}=\\E{e^{t(X-a)}}\\). Dividing by \\(e^{ta}\\) only rescales the picture so that the threshold has width 1.</p>
<h4>One idea behind all three bounds</h4>
<p>Any \\(g\\ge0\\) with \\(g(n)\\ge1\\) for \\(n\\ge a\\) gives \\(\\Prob{X\\ge a}\\le\\E{g(X)}\\), because \\(g\\ge\\mathbf 1[\\,\\cdot\\ge a]\\). Markov uses \\(g(n)=n/a\\), Chebychev \\(\\bigl(\\frac{n-\\mu}{a-\\mu}\\bigr)^2\\), Chernoff \\(e^{t(n-a)}\\). The closer \\(g\\) hugs the step where the mass is, the better the bound. The exponential is almost 0 left of \\(a\\), where nearly all the mass is, and it grows fast right of \\(a\\), where almost none is.</p>
<h4>Which \\(t\\)</h4>
<p>The bound \\(\\E{e^{t(X-a)}}\\) is convex in \\(t\\). Its minimum \\(t^*\\) is where the tilted mean equals \\(a\\). For \\(X\\sim\\Bin(n,p)\\) and \\(a=cn\\), the minimum is \\(e^{-n\\,D(c\\,\\|\\,p)}\\) with the relative entropy \\(D(c\\,\\|\\,p)=c\\ln\\frac cp+(1-c)\\ln\\frac{1-c}{1-p}\\).</p>
<p>The usual proof first estimates \\(\\E{e^{tX}}\\le e^{\\mu(e^t-1)}\\), from \\(1+x\\le e^x\\) for every coin, and then picks the best \\(t\\) for this estimate, \\(t=\\ln(1+\\delta)\\) with \\(a=(1+\\delta)\\mu\\). That gives Chernoff (1). It is weaker than the exact minimum, but it holds for every sum of independent \\(\\{0,1\\}\\)-variables with mean \\(\\mu\\), not only for the binomial.</p>
<p>Even at \\(t^*\\) a gap to the truth remains: the waste above and to the right of the rectangle. For the binomial it grows like \\(\\sqrt n\\), much slower than the probabilities shrink.</p>`
};
/* ==========================================================================
   TABS 4/5 — the exact tail and the bounds, all as natural logarithms
   ========================================================================== */
/* ln P[X ≥ k] for X ~ Bin(n, p), k = 0..n (Float64Array; -Infinity beyond what matters) */
const LT_CACHE = new Map();
function logTail(n, p) {
  const key = n + "|" + p;
  if (LT_CACHE.has(key)) return LT_CACHE.get(key);
  const lq = Math.log1p(-p), lr = Math.log(p) - lq;
  const lp = new Float64Array(n + 1).fill(-Infinity);
  lp[0] = n * lq;
  let K = n;
  for (let k = 0; k < n; k++) {
    lp[k + 1] = lp[k] + Math.log((n - k) / (k + 1)) + lr;
    if (k + 1 > n * p && lp[k + 1] < -2500) { K = k + 1; break; }
  }
  const T = new Float64Array(n + 2).fill(-Infinity);
  for (let k = K; k >= 0; k--) T[k] = lse(lp[k], T[k + 1]);
  for (let k = 0; k <= n; k++) if (T[k] > 0) T[k] = 0;
  if (LT_CACHE.size > 6) LT_CACHE.delete(LT_CACHE.keys().next().value);
  LT_CACHE.set(key, T);
  return T;
}
const BOUNDS = [
  { id: "exact",  name: "exact",        col: "var(--c-exact)",  dash: "",        w: 2.6, tex: "\\Prob{X\\ge x}",                                   uses: "the distribution" },
  { id: "markov", name: "Markov",       col: "var(--c-markov)", dash: "9 4",     w: 2,   tex: "\\frac{np}{x}",                                     uses: "\\(\\E{X}=np\\)" },
  { id: "cheb",   name: "Chebychev",    col: "var(--c-cheb)",   dash: "2 3",     w: 2.2, tex: "\\frac{np(1-p)}{(x-np)^2}",                         uses: "\\(\\Var{X}=np(1-p)\\)" },
  { id: "cher1",  name: "Chernoff (1)", col: "var(--c-cher)",   dash: "",        w: 2,   tex: "\\Bigl(\\frac{e^{\\delta}}{(1+\\delta)^{1+\\delta}}\\Bigr)^{np}", uses: "independence" },
  { id: "cher2",  name: "Chernoff (2)", col: "var(--c-cher)",   dash: "6 3",     w: 1.6, tex: "e^{-np\\delta^2/3}\\ \\ (\\delta\\le1)",            uses: "independence" },
  { id: "hoeff",  name: "Hoeffding",    col: "var(--c-hoeff)",  dash: "12 3 2 3", w: 2,  tex: "e^{-2(x-np)^2/n}",                                  uses: "independence" },
  { id: "pow2",   name: "Chernoff, large", col: "var(--c-pow2)", dash: "3 2",    w: 2.2, tex: "2^{-x}\\ \\ (x\\ge6np)",                            uses: "independence" }
];
function boundsLn(n, p, x) {
  const mu = n * p, d = x - mu, del = x / mu - 1;
  return {
    markov: x > 0 ? Math.log(mu / x) : NaN,
    cheb: d > 0 ? Math.log(n * p * (1 - p) / (d * d)) : NaN,
    cher1: del > 0 ? mu * (del - (1 + del) * Math.log1p(del)) : NaN,
    cher2: del > 0 && del <= 1 + 1e-12 ? -mu * del * del / 3 : NaN,
    hoeff: d > 0 ? -2 * d * d / n : NaN,
    pow2: x >= 6 * mu - 1e-9 ? -x * Math.LN2 : NaN

}
const exactLn = (n, p, x) => { const T = logTail(n, p), k = Math.ceil(x - 1e-9); return k <= 0 ? 0 : k > n ? -Infinity : T[k]; };

const RACE_EXPLAIN = `
<h4>What each bound uses</h4>
<p><b>Markov</b> needs only \\(X\\ge0\\) and \\(\\E{X}\\); <b>Chebychev</b> also \\(\\Var{X}\\) (it is Markov for \\((X-\\E{X})^2\\)); the <b>Chernoff</b> bounds and <b>Hoeffding</b> need that \\(X\\) is a sum of independent \\(\\{0,1\\}\\)-variables (they are Markov for \\(e^{tX}\\)). More assumptions, faster decay: polynomial in the distance for Markov and Chebychev, exponential for the others.</p>
<h4>The forms plotted</h4>
<p>With \\(\\mu=np\\) and \\(x=(1+\\delta)\\mu\\): Chernoff (1) is \\(\\bigl(e^\\delta/(1+\\delta)^{1+\\delta}\\bigr)^{\\mu}\\) for all \\(\\delta>0\\); Chernoff (2), \\(e^{-\\mu\\delta^2/3}\\), holds only for \\(\\delta\\in(0,1]\\), so its curve stops at \\(x=2\\mu\\); &ldquo;Chernoff, large&rdquo; is \\(\\Prob{X\\ge R}\\le2^{-R}\\) for \\(R\\ge6\\mu\\).</p>
<p>Chebychev and Hoeffding bound the two-sided event \\(|X-\\mu|\\ge d\\); the plot uses them for the upper tail \\(X\\ge\\mu+d\\), which is part of it. Hoeffding's two-sided form carries a factor 2, \\(2e^{-2d^2/n}\\); for one side alone, \\(e^{-2d^2/n}\\) holds.</p>
<h4>With high probability</h4>
<p>An event fails &ldquo;with high probability&rdquo; only with probability \\(O(n^{-c})\\) for <i>every</i> constant \\(c\\). A bound below \\(n^{-c}\\) at distance \\(d(n)\\) for every \\(c\\) is what the shaded band \\(np\\pm n^{0.501}\\) is about: outside it, Hoeffding gives \\(e^{-2n^{0.002}}\\), smaller than any \\(n^{-c}\\) for large enough \\(n\\) (although not yet for the \\(n\\) shown here).</p>
<p>A bound can be far from the truth and still be enough: what matters is whether it is below the line you need.</p>`;

function makeRace(P, small) {
  const S = { P, small, n: small ? 1000 : 100, pStr: "1/2", p: 0.5, vs: "x", cStr: "3/4", c: 0.75, probe: small ? 6 : 75, dec: 15, full: false,
              show: { exact: true, markov: true, cheb: true, cher1: true, cher2: true, hoeff: true, pow2: !!small },
              split: 0.62, H: 420, Hdef: 420, preset: small ? "n1000" : "table", geom: null, ser: null, serKey: "" };

  S.sliderToN = u => Math.round(Math.pow(10, nLo + u / 1000 * (nHi - nLo)));
  S.pOf = () => small ? 1 / S.n : S.p;
  S.syncUI = () => {
    el(P + "NS").value = S.nToSlider(S.n); el(P + "N").value = S.n;
    if (!small) {
      el(P + "PS").value = Math.round(S.p * 100); el(P + "P").value = S.pStr;
      el(P + "Vs").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === S.vs));
      el(P + "C").value = S.cStr; el(P + "CBox").classList.toggle("hidden", S.vs !== "n");
      el(P + "FullBox").classList.toggle("hidden", S.vs !== "x"); el(P + "Full").checked = S.full;
    }
    el(P + "Dec").value = S.dec; el(P + "Pre").value = S.preset || "";
  };
  const changed = (keepPreset) => { if (!keepPreset) S.preset = ""; S.clampProbe(); S.syncUI(); renderRace(S); writeHash(); };
  S.applyPreset = key => {
    const pr = RACE_PRESETS[small ? "small" : "race"][key]; if (!pr) return;
    const st = pr.set;
    S.n = st.n; if (st.p) { S.pStr = st.p; S.p = parseNum(st.p); } S.vs = st.vs || "x";
    if (st.c) { S.cStr = st.c; S.c = parseNum(st.c); } S.probe = st.probe; S.dec = st.dec; S.full = false; S.preset = key;
    changed(true);
  };
  /* x range in x-mode, n range in n-mode */
  S.range = () => {
    const n = S.n, p = S.pOf(), mu = n * p;
    if (S.vs === "n") { const q = S.qOf(); return { lo: q, hi: Math.max(q, Math.floor(n / q) * q), q }; }

    }

    const lo = Math.max(0, Math.floor(mu - 1.15 * band));
    if (S.full) return { lo, hi: n };
    const T = logTail(n, p), lim = -S.dec * Math.LN10;

  /* the step of n in the n-mode: smallest q with c·q an integer (else 1) */

    const n = S.vs === "n" ? t : S.n, p = S.pOf(), x = S.vs === "n" ? S.c * t : t;
    const b = boundsLn(n, p, x);

  };

  el(P + "Pre").onchange = e => { if (e.target.value) S.applyPreset(e.target.value); };
  el(P + "NS").oninput = e => { S.n = Math.max(small ? 10 : 2, S.sliderToN(+e.target.value)); changed(); };
  el(P + "N").onchange = e => {
    try { const v = Math.round(parseNum(e.target.value)); if (v < 2 || v > (small ? 1e6 : 1e4)) throw new Error(); S.n = v; e.target.style.borderColor = ""; changed(); }
    catch (er) { e.target.style.borderColor = "var(--wi-active)"; }
  };
  if (!small) {
    el(P + "PS").oninput = e => { S.p = +e.target.value / 100; S.pStr = String(S.p); changed(); };
    el(P + "P").onchange = e => {
      try { const v = parseNum(e.target.value); if (!(v > 0 && v < 1)) throw new Error(); S.p = v; S.pStr = e.target.value.trim(); e.target.style.borderColor = ""; changed(); }
      catch (er) { e.target.style.borderColor = "var(--wi-active)"; }
    };
    el(P + "Vs").querySelectorAll("button").forEach(b => b.onclick = () => {
      if (S.vs === b.dataset.v) return;
      S.vs = b.dataset.v;
      if (S.vs === "n") { if (!(S.c > S.p && S.c <= 1)) { S.c = Math.min(1, (S.p + 1) / 2); S.cStr = fnum(S.c, 3); } S.probe = Math.round(S.n / 2); }
      else S.probe = Math.round((S.n * S.p + S.n) / 2);

    el(P + "C").onchange = e => {
      try { const v = parseNum(e.target.value); if (!(v > 0 && v <= 1)) throw new Error(); S.c = v; S.cStr = e.target.value.trim(); e.target.style.borderColor = ""; changed(); }
      catch (er) { e.target.style.borderColor = "var(--wi-active)"; }
    };

  }
  el(P + "Dec").onchange = e => { S.dec = +e.target.value; changed(true); };
  /* the table: rows with checkboxes */
  let th = `<table class="bt"><thead><tr><th></th><th>bound</th><th></th><th class="v" id="${P}ValH">value</th><th class="v">vs. exact</th></tr></thead><tbody>`;
  for (const B of BOUNDS) {
    if (small && B.id === "cher2") continue;
    th += `<tr id="${P}row-${B.id}"><td><input type="checkbox" data-b="${B.id}" title="show / hide this curve"></td>
      <td class="nm"><svg class="lsw" width="30" height="10"><line x1="1" x2="29" y1="5" y2="5" stroke="${B.col}" stroke-width="${B.w + 0.4}" stroke-dasharray="${B.dash}"/></svg> ${B.name}</td>
      <td class="fm" data-tex="${esc(B.tex)}"></td><td class="v val"></td><td class="v r"></td></tr>`;
  }
  th += `</tbody></table><div class="tnote" id="${P}Note"></div>`;
  el(P + "Table").innerHTML = th;
  el(P + "Table").querySelectorAll("input[data-b]").forEach(cb => {
    cb.checked = S.show[cb.dataset.b];
    cb.onchange = () => { S.show[cb.dataset.b] = cb.checked; renderRace(S); writeHash(); };
  });

  initRacePointer(S);

}

/* ---- the series for the n-mode (exact needs one binomial per n) ---- */
function nSeries(S, lo, hi, npts) {
  const q = S.qOf(), key = [S.n, S.pOf(), S.c, lo, hi, npts, q].join("|");
  if (S.serKey === key) return S.ser;
  const ms = [], cnt = Math.floor((hi - lo) / q) + 1;
  if (cnt <= npts) for (let m = lo; m <= hi; m += q) ms.push(m);
  else for (let i = 0; i < npts; i++) { const m = lo + q * Math.round((cnt - 1) * i / (npts - 1)); if (!ms.length || ms[ms.length - 1] !== m) ms.push(m); }
  const out = ms.map(m => S.valuesAt(m));
  S.ser = out; S.serKey = key;
  return out;
}

function renderRace(S) {

    s += e === 0 ? `<text class="sv-tick" x="${x0 - 8}" y="${f1(y + 4)}" text-anchor="end">1</text>`

    s += `<line x1="${f1(X(t))}" x2="${f1(X(t))}" y1="${y1}" y2="${y1 + 5}" stroke="${soft}"/>`;
    s += `<text class="sv-tick" x="${f1(X(t))}" y="${y1 + 18}" text-anchor="middle">${fnum(t, 2)}</text>`;

function raceTable(S, pv) {

  if (document.readyState === "complete") hook(); else window.addEventListener("load", hook);
}
init();
</script>
