<!DOCTYPE html><html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F5EBD9">
  <title>Slides</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/epigrafica/epigrafica-entona-webfont.woff2">
  <link rel="modulepreload" href="/assets/slides/viewer.js">
  <link rel="modulepreload" href="/assets/slides/core.js">
  <link rel="modulepreload" href="/assets/slides/cache.js">
  <link rel="modulepreload" href="/assets/slides/deck-pdf.js">
  <link rel="modulepreload" href="/assets/slides/open.js">
  <link rel="modulepreload" href="/assets/pdfjs/v6/build/pdf.min.mjs">
  <link rel="stylesheet" href="/assets/slides/viewer.css">
  <script>
    // talk data and thumbnail start loading before the modules are parsed
    (function () {
      var t = new URLSearchParams(location.search).get('t');
      if (t && /^[a-z][a-z0-9-]*$/.test(t)) {
        var l = document.createElement('link'); l.rel = 'preload'; l.as = 'fetch'; l.href = '/talks/' + t + '.json'; l.crossOrigin = 'anonymous'; document.head.appendChild(l);
        var i = document.createElement('link'); i.rel = 'preload'; i.as = 'image'; i.href = '/talks/' + t + '.thumb.webp'; document.head.appendChild(i);
      }
    })();
  </script>
  <script data-goatcounter="https://wild-inter-net.goatcounter.com/count"
          data-goatcounter-settings='{"no_onload": true}'
          async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
  <div id="sv" class="sv">
    <noscript><div class="sv-error">The slide viewer needs JavaScript. <a href="/talks/">All talks</a> (each with a PDF download).</div></noscript>
  </div>
  <script type="module" src="/assets/slides/viewer.js"></script>
</body>
</html>
