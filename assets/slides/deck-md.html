<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markdown slides</title>
<!-- deck-md.html -- renders a Markdown deck (Marp) for the slide viewer,
     /slides/?md=…  The viewer loads this page into a sandboxed iframe (scripts
     only, no access to the site) and posts it the Markdown; see deck-md.js and
     _tools/talks/DEVNOTES-viewer.md, "Markdown slides". -->
<script data-goatcounter="https://wild-inter-net.goatcounter.com/count" data-goatcounter-settings='{"no_onload": true}' async src="//gc.zgo.at/count.js"></script>
<!-- fonts: posted by the viewer (deck-md.js addFonts), as the sandboxed
     frame may not load the site's own -->
<style>
	html, body { margin: 0; height: 100%; background: #3b3832; overflow: hidden; }
	#deck, #deck > .marpit { position: absolute; inset: 0; }
	#deck svg[data-marpit-svg] { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
	#deck svg[data-marpit-svg]:not(.wi-cur) { visibility: hidden; }
	#deck [data-marpit-fragment]:not(.wi-shown) { visibility: hidden; }
	#msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #F5EBD9;
		font: 18px/1.4 texgyrepagella, Palatino, serif; padding: 2em; text-align: center; }
	#msg[hidden] { display: none; }
	#msg code { font-size: 15px; white-space: pre-wrap; text-align: left; display: block; margin-top: 1em; color: #ecddc5; }
</style>
</head>
<body>
<div id="deck"></div>
<div id="msg">Loading the slides…</div>
<script src="/assets/slides/vendor/marp-core-4.4.0.js"></script>
<script src="/assets/slides/deck-bridge.js"></script>
<script src="/assets/slides/deck-md.js"></script>
</body></html>
